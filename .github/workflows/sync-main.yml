name: Sync main from upstream

# Keeps this fork's main equal to The-AI-Alliance/gofannon:main so that every
# donation branch is cut from current upstream. Runs daily and on demand.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main
        run: |
          git remote add upstream https://github.com/The-AI-Alliance/gofannon.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          # Fast-forward only. If this fails, main has commits of its own,
          # which it should not -- donations live on branches.
          git merge --ff-only upstream/main
          git push origin main
